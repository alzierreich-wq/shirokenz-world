<!DOCTYPE html>
<html>
<head>
<title>Shirokenz World</title>

<style>
body{
margin:0;
font-family:Arial;
background:#071a2b;
color:white;
text-align:center;
}

.menu{
margin-top:120px;
}

button{
display:block;
margin:15px auto;
width:200px;
padding:12px;
background:black;
color:white;
border:none;
border-radius:8px;
font-size:16px;
}

#game{
display:none;
}

.map{
width:90%;
max-width:900px;
margin:auto;
margin-top:40px;
}
</style>

</head>

<body>

<div id="menu" class="menu">
<h1>Shirokenz World</h1>

<button onclick="startGame()">Games</button>
<button>Editor</button>
<button>Settings</button>
<button>Tutorial</button>
<button>Exit Game</button>
</div>


<div id="game">

<h2>World Map</h2>

<img class="map" src="map.png">

<br><br>

<button onclick="backMenu()">Back to Menu</button>

</div>


<script>

function startGame(){
document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";
}

function backMenu(){
document.getElementById("game").style.display="none";
document.getElementById("menu").style.display="block";
}

</script>

</body>
</html>
