<!DOCTYPE html>
<html>
<head>
<title>Shirokenz World</title>

<style>

body{
margin:0;
background:#071a2b;
color:white;
font-family:Arial;
text-align:center;
}

#menu{
margin-top:120px;
}

button{
display:block;
margin:10px auto;
width:200px;
padding:10px;
background:black;
color:white;
border:none;
border-radius:8px;
}

#game{
display:none;
position:relative;
}

.map{
width:100%;
max-width:1200px;
}

.province{
position:absolute;
width:20px;
height:20px;
background:red;
border-radius:50%;
cursor:pointer;
}

#panel{
position:fixed;
right:20px;
top:100px;
background:#111;
padding:15px;
border-radius:10px;
display:none;
width:220px;
text-align:left;
}

</style>
</head>

<body>

<div id="menu">

<h1>Shirokenz World Strategy</h1>

<button onclick="startGame()">Start Game</button>
<button>Editor</button>
<button>Settings</button>
<button>Tutorial</button>

</div>

<div id="game">

<img src="map.png" class="map">

<!-- Provinsi -->

<div class="province"
style="left:420px; top:200px;"
onclick="openProvince(0)">
</div>

<div class="province"
style="left:760px; top:260px;"
onclick="openProvince(1)">
</div>

<div class="province"
style="left:980px; top:240px;"
onclick="openProvince(2)">
</div>

</div>

<div id="panel">

<h3 id="p_name"></h3>

<p id="p_country"></p>
<p id="p_population"></p>
<p id="p_economy"></p>
<p id="p_happiness"></p>
<p id="p_army"></p>

</div>


<script>

function startGame(){

document.getElementById("menu").style.display="none"
document.getElementById("game").style.display="block"

}


let provinces = [

{
name:"Shirokane",
country:"Great Shirokenz Family",
population:30000000,
economy:789028,
happiness:95,
army:5000
},

{
name:"Tolova",
country:"Great Shinkei",
population:21000000,
economy:520000,
happiness:90,
army:4200
},

{
name:"Rvn",
country:"Reivhian Republic",
population:22000000,
economy:610000,
happiness:88,
army:4500
}

]


function openProvince(id){

let p = provinces[id]

document.getElementById("panel").style.display="block"

document.getElementById("p_name").innerText =
"Provinsi: " + p.name

document.getElementById("p_country").innerText =
"Negara: " + p.country

document.getElementById("p_population").innerText =
"Populasi: " + p.population

document.getElementById("p_economy").innerText =
"Ekonomi: " + p.economy

document.getElementById("p_happiness").innerText =
"Kebahagiaan: " + p.happiness

document.getElementById("p_army").innerText =
"Tentara: " + p.army

}

</script>

</body>
</html>
