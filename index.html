<!DOCTYPE html>
<html>
<head>
<title>Shirokenz World</title>

<style>

body{
margin:0;
background:#071a2b;
color:white;
font-family:Arial;
text-align:center;
}

#menu{
margin-top:120px;
}

button{
display:block;
margin:10px auto;
width:200px;
padding:10px;
background:black;
color:white;
border:none;
border-radius:8px;
}

#game{
display:none;
position:relative;
}

.map{
width:100%;
max-width:1200px;
}

.province{
position:absolute;
width:18px;
height:18px;
background:red;
border-radius:50%;
cursor:pointer;
}

#panel{
position:fixed;
right:20px;
top:100px;
background:#111;
padding:15px;
border-radius:10px;
display:none;
width:220px;
text-align:left;
}

</style>
</head>

<body>

<div id="menu">

<h1>Shirokenz World</h1>

<button onclick="startGame()">Start Game</button>
<button>Editor</button>
<button>Settings</button>
<button>Tutorial</button>

</div>

<div id="game">

<img src="map.png" class="map">

<div id="provincesLayer"></div>

</div>


<div id="panel">

<h3 id="p_name"></h3>
<p id="p_country"></p>
<p id="p_pop"></p>
<p id="p_eco"></p>
<p id="p_happy"></p>

</div>


<script>

function startGame(){

document.getElementById("menu").style.display="none"
document.getElementById("game").style.display="block"

createProvinces()

}


let provinces = [

{
name:"Shirokane",
country:"Great Shirokenz Family",
population:30000000,
economy:789028,
happiness:95,
x:500,
y:250
},

{
name:"Tolova",
country:"Great Shinkei",
population:21000000,
economy:520000,
happiness:90,
x:700,
y:320
},

{
name:"Rvn",
country:"Reivhian Republic",
population:22000000,
economy:610000,
happiness:88,
x:900,
y:260
}

]


function createProvinces(){

let layer = document.getElementById("provincesLayer")

provinces.forEach((p,i)=>{

let div = document.createElement("div")

div.className="province"

div.style.left = p.x + "px"
div.style.top = p.y + "px"

div.onclick = ()=>openProvince(i)

layer.appendChild(div)

})

}


function openProvince(id){

let p = provinces[id]

document.getElementById("panel").style.display="block"

document.getElementById("p_name").innerText = "Provinsi: " + p.name
document.getElementById("p_country").innerText = "Negara: " + p.country
document.getElementById("p_pop").innerText = "Populasi: " + p.population
document.getElementById("p_eco").innerText = "Ekonomi: " + p.economy
document.getElementById("p_happy").innerText = "Kebahagiaan: " + p.happiness

}

</script>

</body>
</html>
