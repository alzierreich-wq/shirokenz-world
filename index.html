<!DOCTYPE html><html><head>
<title>Shirokenz World</title><style>

body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
}

#menu{
position:absolute;
width:100%;
height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

#game{
display:none;
}

#gameMap{
position:relative;
width:1280px;
height:720px;
margin:auto;
background:url("map.png");
background-size:cover;
}

.province{
position:absolute;
width:18px;
height:18px;
background:rgba(255,255,255,0.3);
border-radius:50%;
cursor:pointer;
}

button{
padding:12px 25px;
margin:10px;
font-size:16px;
cursor:pointer;
}

</style></head><body><div id="menu"><h1>Shirokenz World Strategy</h1><button onclick="startGame()">Start Game</button>
<button>Editor</button>
<button>Settings</button>
<button>Tutorial</button>

</div><div id="game"><h2>World Map</h2><div id="gameMap"></div></div><script>

const WORLD={
provinces:[],
countries:[]
};

class Province{

constructor(id,x,y){

this.id=id;
this.x=x;
this.y=y;

this.population=500000;
this.economy=1000;
this.loyalty=80;

}

}

class Country{

constructor(id,name){

this.id=id;
this.name=name;
this.money=1000000;

}

}

function generateProvinces(){

let map=document.getElementById("gameMap");

for(let i=0;i<200;i++){

let x=Math.random()*1200;
let y=Math.random()*650;

let province=new Province(i,x,y);

WORLD.provinces.push(province);

let div=document.createElement("div");

div.className="province";
div.style.left=x+"px";
div.style.top=y+"px";

div.onclick=function(){

alert(
"Province ID: "+province.id+
"\nPopulation: "+Math.floor(province.population)+
"\nEconomy: "+province.economy
);

};

map.appendChild(div);

}

}

function worldUpdate(){

WORLD.provinces.forEach(p=>{
p.population+=p.population*0.002;
});

}

function startGame(){

document.getElementById("menu").style.display="none";
document.getElementById("game").style.display="block";

generateProvinces();

let country=new Country(0,"Great Shirokenz Family");

WORLD.countries.push(country);

setInterval(worldUpdate,2000);

}

</script></body></html>
