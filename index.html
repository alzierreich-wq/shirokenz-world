<!DOCTYPE html><html><head>
<title>Shirokenz World Strategy</title><style>

body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
}

#gameMap{
position:relative;
width:1280px;
height:720px;
margin:auto;
background:url("map.png");
background-size:cover;
}

.province{
position:absolute;
width:20px;
height:20px;
background:rgba(255,255,255,0.2);
border-radius:50%;
cursor:pointer;
}

</style></head><body><h1>Shirokenz World Strategy Game</h1><button onclick="startGame()">Start Game</button>

<div id="gameMap"></div><script>

////////////////////////////////////////////////
// WORLD ENGINE
////////////////////////////////////////////////

const WORLD={
provinces:[],
countries:[]
};

class Province{

constructor(id,x,y){

this.id=id;
this.x=x;
this.y=y;

this.population=500000;
this.economy=1000;
this.loyalty=80;

}

}

class Country{

constructor(id,name){

this.id=id;
this.name=name;
this.money=1000000;

}

}

////////////////////////////////////////////////
// GENERATE PROVINCES
////////////////////////////////////////////////

function generateProvinces(){

let map=document.getElementById("gameMap");

for(let i=0;i<200;i++){

let x=Math.random()*1200;
let y=Math.random()*650;

let province=new Province(i,x,y);

WORLD.provinces.push(province);

let div=document.createElement("div");

div.className="province";
div.style.left=x+"px";
div.style.top=y+"px";

div.onclick=function(){

alert("Province ID: "+province.id+
"\nPopulation: "+province.population+
"\nEconomy: "+province.economy);

};

map.appendChild(div);

}

}

////////////////////////////////////////////////
// WORLD UPDATE
////////////////////////////////////////////////

function worldUpdate(){

WORLD.provinces.forEach(p=>{

p.population+=p.population*0.002;

});

}

////////////////////////////////////////////////
// START GAME
////////////////////////////////////////////////

function startGame(){

generateProvinces();

let country=new Country(0,"Great Shirokenz Family");

WORLD.countries.push(country);

setInterval(worldUpdate,2000);

}

</script></body>
</html>
